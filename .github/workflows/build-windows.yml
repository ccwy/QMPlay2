name: Build Windows Portable

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            p7zip

      - name: Install dependencies
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm \
            mingw-w64-ucrt-x86_64-gcc \
            mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja \
            mingw-w64-ucrt-x86_64-pkg-config \
            mingw-w64-ucrt-x86_64-qt6-base \
            mingw-w64-ucrt-x86_64-qt6-tools \
            mingw-w64-ucrt-x86_64-qt6-5compat \
            mingw-w64-ucrt-x86_64-qt6-svg \
            mingw-w64-ucrt-x86_64-qt6-declarative \
            mingw-w64-ucrt-x86_64-ffmpeg \
            mingw-w64-ucrt-x86_64-libass \
            mingw-w64-ucrt-x86_64-taglib \
            mingw-w64-ucrt-x86_64-libgme \
            mingw-w64-ucrt-x86_64-libsidplayfp \
            mingw-w64-ucrt-x86_64-libcdio \
            mingw-w64-ucrt-x86_64-libcddb \
            mingw-w64-ucrt-x86_64-portaudio \
            mingw-w64-ucrt-x86_64-openal \
            mingw-w64-ucrt-x86_64-shaderc

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix QtWinExtras symlink
        shell: pwsh
        run: |
          $src = "src\gui\Windows\qt\qtwinextras_submodule\src\winextras"
          $dst = "src\gui\Windows\qt\QtWinExtras"
          if (Test-Path $dst) { Remove-Item $dst -Force -Recurse }
          Copy-Item $src $dst -Recurse
          Test-Path "$dst\qwinevent.cpp"

      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ucrt64 = "${{ steps.msys2.outputs.msys2-location }}\ucrt64"
          $env:PATH = "$ucrt64\bin;$env:PATH"
          $env:PKG_CONFIG_PATH = "$ucrt64\lib\pkgconfig"
          cmake -GNinja -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$ucrt64\bin\gcc.exe" `
            -DCMAKE_CXX_COMPILER="$ucrt64\bin\g++.exe" `
            -DCMAKE_INSTALL_PREFIX="$PWD\QMPlay2-portable" `
            -DCMAKE_PREFIX_PATH="$ucrt64" `
            -DUSE_VULKAN=OFF `
            -DUSE_FFMPEG_DXVA2=ON `
            -DUSE_CUVID=OFF `
            -DUSE_PIPEWIRE=OFF `
            -DUSE_PULSEAUDIO=OFF `
            -DUSE_ALSA=OFF `
            -DUSE_XVIDEO=OFF `
            -DUSE_FFMPEG_AVDEVICE=OFF `
            -DUSE_FFMPEG_VAAPI=OFF `
            -DUSE_UPDATES=OFF `
            -DUSE_FREEDESKTOP_NOTIFICATIONS=OFF `
            -DUSE_DBUS_PM=OFF `
            -DUSE_MPRIS2=OFF `
            -DUSE_RUBBERBAND=OFF `
            -DUSE_OPENMPT=OFF

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ucrt64 = "${{ steps.msys2.outputs.msys2-location }}\ucrt64"
          $env:PATH = "$ucrt64\bin;$env:PATH"
          ninja -C build

      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ucrt64 = "${{ steps.msys2.outputs.msys2-location }}\ucrt64"
          $env:PATH = "$ucrt64\bin;$env:PATH"
          ninja -C build install

      - name: Collect DLL dependencies
        shell: msys2 {0}
        run: |
          # Use ldd to find all DLL dependencies of the built exe and modules
          UCRT64_BIN="/ucrt64/bin"
          DEST="QMPlay2-portable"

          # Find all .exe and .dll in the portable dir, collect their deps
          find "$DEST" -name '*.exe' -o -name '*.dll' | while read -r bin; do
            ldd "$bin" 2>/dev/null | grep "$UCRT64_BIN" | awk '{print $3}' | while read -r dll; do
              if [ -f "$dll" ] && [ ! -f "$DEST/$(basename "$dll")" ]; then
                cp "$dll" "$DEST/"
              fi
            done
          done

          # Repeat for newly copied DLLs (transitive deps)
          find "$DEST" -maxdepth 1 -name '*.dll' | while read -r bin; do
            ldd "$bin" 2>/dev/null | grep "$UCRT64_BIN" | awk '{print $3}' | while read -r dll; do
              if [ -f "$dll" ] && [ ! -f "$DEST/$(basename "$dll")" ]; then
                cp "$dll" "$DEST/"
              fi
            done
          done

          echo "=== Copied DLLs ==="
          ls "$DEST"/*.dll | wc -l
          echo "DLLs total"

      - name: Add Qt plugins
        shell: pwsh
        run: |
          $ucrt64 = "${{ steps.msys2.outputs.msys2-location }}\ucrt64"
          New-Item -ItemType File -Path "QMPlay2-portable\portable" -Force
          $dirs = @("platforms", "styles", "iconengines", "imageformats")
          foreach ($d in $dirs) { New-Item -ItemType Directory -Path "QMPlay2-portable\$d" -Force }
          $qtPlugins = "$ucrt64\share\qt6\plugins"
          Copy-Item "$qtPlugins\platforms\qwindows.dll" "QMPlay2-portable\platforms\" -ErrorAction SilentlyContinue
          Copy-Item "$qtPlugins\platforms\qdirect2d.dll" "QMPlay2-portable\platforms\" -ErrorAction SilentlyContinue
          Copy-Item "$qtPlugins\styles\qwindowsvistastyle.dll" "QMPlay2-portable\styles\" -ErrorAction SilentlyContinue
          Copy-Item "$qtPlugins\iconengines\qsvgicon.dll" "QMPlay2-portable\iconengines\" -ErrorAction SilentlyContinue
          Copy-Item "$qtPlugins\imageformats\*.dll" "QMPlay2-portable\imageformats\" -ErrorAction SilentlyContinue

      - name: Package portable 7z
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ucrt64 = "${{ steps.msys2.outputs.msys2-location }}\ucrt64"
          $env:PATH = "$ucrt64\bin;$env:PATH"
          $version = & bash -c "cat version | sh"
          7z a -t7z -mx9 "QMPlay2-Win64-${version}-portable.7z" QMPlay2-portable/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QMPlay2-Win64-portable
          path: "*.7z"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: "*.7z"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
