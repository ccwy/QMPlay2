name: Build Windows Portable

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            ninja
            cmake
            pkg-config
            gcc
            p7zip

      - name: Install dependencies
        run: |
          pacman -S --noconfirm \
            mingw-w64-ucrt-x86_64-qt6-base \
            mingw-w64-ucrt-x86_64-qt6-tools \
            mingw-w64-ucrt-x86_64-qt6-5compat \
            mingw-w64-ucrt-x86_64-qt6-svg \
            mingw-w64-ucrt-x86_64-qt6-declarative \
            mingw-w64-ucrt-x86_64-ffmpeg \
            mingw-w64-ucrt-x86_64-libass \
            mingw-w64-ucrt-x86_64-taglib \
            mingw-w64-ucrt-x86_64-libgme \
            mingw-w64-ucrt-x86_64-libsidplayfp \
            mingw-w64-ucrt-x86_64-libcdio \
            mingw-w64-ucrt-x86_64-libcddb \
            mingw-w64-ucrt-x86_64-portaudio \
            mingw-w64-ucrt-x86_64-openal \
            mingw-w64-ucrt-x86_64-shaderc

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -GNinja -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/QMPlay2-portable" \
            -DUSE_VULKAN=OFF \
            -DUSE_FFMPEG_DXVA2=ON \
            -DUSE_CUVID=OFF \
            -DUSE_PIPEWIRE=OFF \
            -DUSE_PULSEAUDIO=OFF \
            -DUSE_ALSA=OFF \
            -DUSE_XVIDEO=OFF \
            -DUSE_FFMPEG_AVDEVICE=OFF \
            -DUSE_UPDATES=OFF \
            -DUSE_FREEDESKTOP_NOTIFICATIONS=OFF \
            -DUSE_DBUS_PM=OFF \
            -DUSE_MPRIS2=OFF

      - name: Build
        run: ninja -C build

      - name: Install
        run: ninja -C build install

      - name: Create portable package
        run: |
          touch QMPlay2-portable/portable
          mkdir -p QMPlay2-portable/platforms
          mkdir -p QMPlay2-portable/styles
          mkdir -p QMPlay2-portable/iconengines
          mkdir -p QMPlay2-portable/imageformats
          cp /ucrt64/share/qt6/plugins/platforms/qwindows.dll QMPlay2-portable/platforms/
          cp /ucrt64/share/qt6/plugins/platforms/qdirect2d.dll QMPlay2-portable/platforms/ 2>/dev/null || true
          cp /ucrt64/share/qt6/plugins/styles/qwindowsvistastyle.dll QMPlay2-portable/styles/ 2>/dev/null || true
          cp /ucrt64/share/qt6/plugins/iconengines/qsvgicon.dll QMPlay2-portable/iconengines/ 2>/dev/null || true
          cp /ucrt64/share/qt6/plugins/imageformats/*.dll QMPlay2-portable/imageformats/ 2>/dev/null || true
          for dll in Qt6Core Qt6Gui Qt6Widgets Qt6Network Qt6Svg Qt6SvgWidgets Qt6OpenGL Qt6OpenGLWidgets Qt6Qml Qt6QmlModels Qt6Core5Compat Qt6DBus; do
            cp /ucrt64/bin/${dll}.dll QMPlay2-portable/ 2>/dev/null || true
          done
          for dll in avformat avcodec avutil swscale swresample avfilter avdevice; do
            cp /ucrt64/bin/lib${dll}-*.dll QMPlay2-portable/ 2>/dev/null || true
          done
          for dll in ass tag gme sidplayfp cdio cddb portaudio openal; do
            cp /ucrt64/bin/lib${dll}-*.dll QMPlay2-portable/ 2>/dev/null || true
            cp /ucrt64/bin/${dll}-*.dll QMPlay2-portable/ 2>/dev/null || true
          done
          cp /ucrt64/bin/libgcc_s_seh-1.dll QMPlay2-portable/ 2>/dev/null || true
          cp /ucrt64/bin/libstdc++-6.dll QMPlay2-portable/ 2>/dev/null || true
          cp /ucrt64/bin/libwinpthread-1.dll QMPlay2-portable/ 2>/dev/null || true
          cp /ucrt64/bin/libgomp-1.dll QMPlay2-portable/ 2>/dev/null || true
          for dll in zlib zstd brotlicommon brotlidec bz2 lzma png16 harfbuzz freetype fontconfig fribidi unistring iconv intl xml2; do
            cp /ucrt64/bin/lib${dll}-*.dll QMPlay2-portable/ 2>/dev/null || true
          done

      - name: Package portable 7z
        run: |
          VERSION=$(cat version | sh)
          7z a -t7z -mx9 "QMPlay2-Win64-${VERSION}-portable.7z" QMPlay2-portable/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QMPlay2-Win64-portable
          path: "*.7z"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: "*.7z"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
